[package]
name = "server"
version = "0.1.0"
edition = "2021"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "epicube-craft-server"
path = "src/main.rs"

# Fabrique des cles et des jetons d'essai, en attendant le service de comptes.
[[bin]]
name = "epicube-craft-jeton"
path = "src/jeton.rs"

[dependencies]
shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
glam = "0.27"
ctrlc = "3"
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
