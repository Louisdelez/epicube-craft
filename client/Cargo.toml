[package]
name = "client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "epicube-craft"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
shared = { path = "../shared" }
server = { path = "../server" }
wgpu = { version = "22.1", features = ["vulkan-portability"] }
winit = "0.29"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.27"
env_logger = "0.11"
png = "0.17"
serde_json = "1"
base64 = "0.22"
rodio = { version = "0.19", default-features = false, features = ["vorbis", "wav", "mp3", "flac"] }
cpal = "0.15"
ureq = "2"

# macOS : reglage de la couche d'affichage (agrandissement net, sans lissage).
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
