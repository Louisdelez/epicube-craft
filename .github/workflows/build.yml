# Compile, teste et empaquette Epicube Craft sur macOS, Linux et Windows.
# Se lance a chaque envoi sur GitHub ; les archives se telechargent depuis la page de l'execution.
# Une etiquette de version (v0.9.0, v1.0.0...) publie en plus ces archives dans une release.
name: Compilation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # La version de Rust est fixee par rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          # Les mods ecrits en Rust se compilent en WebAssembly.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Bibliotheques systeme (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      # Le mod d'exemple en Rust sert aux essais des mods WebAssembly.
      - name: Mod d'exemple (WebAssembly)
        shell: bash
        run: sh exemples/mods/rubis/construire.sh
      - name: Tests
        run: cargo test --workspace
      - name: Empaquetage (macOS, Linux)
        if: runner.os != 'Windows'
        run: sh scripts/empaqueter.sh
      - name: Empaquetage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/empaqueter.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: epicube-craft-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publication dans la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
