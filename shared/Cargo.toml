[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
glam = "0.27"
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.2"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
wasmtime = { version = "51.0.0", default-features = false, features = ["cranelift", "runtime"] }
epicube-mod = { path = "../modkit" }
